  function renderWeeklySummary(){
    const container = document.getElementById("weeklySummary");
    if(!container) return;
    const today = new Date();
    const weekStart = new Date(today.getFullYear(),today.getMonth(),today.getDate());
    weekStart.setDate(weekStart.getDate()-(weekStart.getDay()+6)%7);
    const weekEnd = new Date(weekStart.getFullYear(),weekStart.getMonth(),weekStart.getDate()+7);
    const startKey = calendarDateKey(weekStart), endKey = calendarDateKey(weekEnd);
    const workoutKeys = new Set(), activeDays = new Set();
    let totalSets = 0;
    data.exercises.forEach(ex => ex.history.forEach(session => {
      const date = new Date(session.date);
      if(!Number.isFinite(date.getTime())) return;
      const key = calendarDateKey(date);
      if(key < startKey || key >= endKey) return;
      workoutKeys.add(`${key}|${ex.dayId || "sem-dia"}`);
      activeDays.add(key);
      totalSets += session.sets.length;
    }));
    const weekLabel = `${weekStart.toLocaleDateString("pt-BR",{day:"2-digit",month:"short"}).replace(".","")} – ${new Date(weekEnd.getFullYear(),weekEnd.getMonth(),weekEnd.getDate()-1).toLocaleDateString("pt-BR",{day:"2-digit",month:"short"}).replace(".","")}`;
    container.innerHTML = `<div class="weekly-summary-heading"><h2>Esta semana</h2><span>${weekLabel}</span></div><div class="weekly-summary-metrics"><div class="weekly-summary-metric"><b>${workoutKeys.size}</b><span>Treinos</span></div><div class="weekly-summary-metric"><b>${totalSets}</b><span>Séries</span></div><div class="weekly-summary-metric"><b>${activeDays.size}/7</b><span>Dias ativos</span></div></div>`;
  }

  function inferMuscleGroup(name){
    const n=String(name||"").toLocaleLowerCase("pt-BR");
    const rules=[
      ["Peito",/supino|crucifixo|peck deck|voador|flexão de braço/],
      ["Costas",/remada|puxada|barra fixa|pulldown|serrote/],
      ["Ombros",/desenvolvimento|elevação lateral|elevação frontal|face pull|crucifixo inverso/],
      ["Bíceps",/rosca|curl/],["Tríceps",/tríceps|testa|coice/],
      ["Quadríceps",/agachamento|leg press|cadeira extensora|avanço|afundo|passada/],
      ["Posterior de coxa",/stiff|terra romeno|mesa flexora|cadeira flexora/],
      ["Glúteos",/glúteo|hip thrust|elevação pélvica/],["Panturrilhas",/panturrilha|gêmeos/],
      ["Abdômen",/abdominal|prancha|infra/],["Cardio",/corrida|esteira|bicicleta|ciclismo|elíptico|corda/]
    ];
    return (rules.find(rule=>rule[1].test(n))||["Outros"])[0];
  }

  function updateExerciseMeta(exId,key,value){
    const ex=data.exercises.find(item=>item.id===exId);if(!ex)return;
    if(key==="muscleGroup"&&MUSCLE_GROUPS.includes(value))ex.muscleGroup=value;
    else if(key==="supersetGroup"&&["","A","B","C","D"].includes(value))ex.supersetGroup=value;
    else if(["targetMinReps","targetMaxReps"].includes(key)&&Number.isInteger(Number(value))&&Number(value)>=0&&Number(value)<=100){
      ex[key]=Number(value);
      if(ex.targetMinReps&&ex.targetMaxReps&&ex.targetMaxReps<ex.targetMinReps){
        if(key==="targetMinReps")ex.targetMaxReps=ex.targetMinReps;else ex.targetMinReps=ex.targetMaxReps;
      }
    }
    save();render();
  }

  function renderExerciseSettings(ex){
    const muscleOptions=MUSCLE_GROUPS.map(group=>`<option value="${group}" ${ex.muscleGroup===group?"selected":""}>${group}</option>`).join("");
    const groups=["","A","B","C","D"];
    const supersetOptions=groups.map(group=>`<option value="${group}" ${(ex.supersetGroup||"")===group?"selected":""}>${group?"Grupo "+group:"Sem grupo"}</option>`).join("");
    return `<details class="exercise-settings"><summary>Metas e organização${ex.supersetGroup?` · Supersérie ${ex.supersetGroup}`:""}</summary><div class="exercise-settings-grid">
      <label>Grupo muscular<select onchange="updateExerciseMeta('${ex.id}','muscleGroup',this.value)">${muscleOptions}</select></label>
      <label>Supersérie/circuito<select onchange="updateExerciseMeta('${ex.id}','supersetGroup',this.value)">${supersetOptions}</select></label>
      <label>Reps mínimas<input type="number" min="0" max="100" value="${ex.targetMinReps||""}" placeholder="—" onchange="updateExerciseMeta('${ex.id}','targetMinReps',this.value)"></label>
      <label>Reps máximas<input type="number" min="0" max="100" value="${ex.targetMaxReps||""}" placeholder="—" onchange="updateExerciseMeta('${ex.id}','targetMaxReps',this.value)"></label>
    </div><p>Exercícios do mesmo grupo alternam ao concluir uma série.</p></details>`;
  }

  function renderAnalyticsView(){
    const container=document.getElementById("analisesView");
    const today=new Date(),start=new Date(today.getFullYear(),today.getMonth(),today.getDate()-6);
    const counts=new Map(MUSCLE_GROUPS.map(group=>[group,0]));
    let totalSets=0;
    data.exercises.forEach(ex=>(ex.history||[]).forEach(session=>{
      const date=new Date(session.date);if(date<start||date>today)return;
      const count=session.sets.filter(set=>set.tag!=="A").length;
      const group=MUSCLE_GROUPS.includes(ex.muscleGroup)?ex.muscleGroup:"Outros";
      counts.set(group,(counts.get(group)||0)+count);totalSets+=count;
    }));
    const active=[...counts.entries()].filter(([,count])=>count>0).sort((a,b)=>b[1]-a[1]);
    const max=Math.max(1,...active.map(([,count])=>count));
    const rows=active.map(([group,count])=>`<div class="muscle-row"><div><b>${escapeHtml(group)}</b><span>${count} séries</span></div><i><span style="width:${Math.round(count/max*100)}%"></span></i></div>`).join("");
    const unassigned=data.exercises.filter(ex=>!ex.muscleGroup||ex.muscleGroup==="Outros").length;
    container.innerHTML=`<div class="insights-heading"><span class="evo-kicker">VISÃO DA SEMANA</span><h2>Análises</h2><p>Distribuição das séries por grupo muscular nos últimos 7 dias.</p></div>
      <section class="insight-total"><b>${totalSets}</b><span>Séries válidas · últimos 7 dias</span></section>
      <section class="insight-card"><h3>Grupos treinados</h3>${rows||'<p class="insight-empty">Registre séries para ver a distribuição. Você pode ajustar o grupo muscular em “Metas e organização” dentro de cada exercício.</p>'}</section>
      <section class="insight-card"><h3>Classificação dos exercícios</h3><p>O app sugere o grupo muscular pelo nome. Revise os exercícios em “Outros” para deixar o resumo mais preciso.</p><button type="button" class="session-action" onclick="switchView('treino')">${unassigned} exercício(s) em “Outros” · revisar</button></section>`;
  }

  function setBodyMetric(metric){
    if(["weight","waist","chest","hips","arm","thigh"].includes(metric)){bodyMetric=metric;renderBodyMeasurementsView();}
  }

  function bodyMetricLabel(metric){return ({weight:"Peso corporal",waist:"Cintura",chest:"Peito",hips:"Quadril",arm:"Braço",thigh:"Coxa"})[metric]||"Peso corporal";}

  function bodyMetricValue(entry,metric){
    const value=metric==="weight"?entry.weight:entry[metric];
    if(value===null||value===undefined||!Number.isFinite(Number(value)))return null;
    return metric==="weight"?displayLoad(Number(value)):Number(value);
  }

  function generateBodyChart(entries,metric){
    const points=entries.map(entry=>({entry,value:bodyMetricValue(entry,metric)})).filter(point=>Number.isFinite(point.value)).slice(-20);
    if(points.length<2)return `<p class="insight-empty">Adicione pelo menos dois registros de ${bodyMetricLabel(metric).toLocaleLowerCase("pt-BR")} para ver a tendência.</p>`;
    const W=340,H=180,L=48,R=12,T=18,B=28,values=points.map(point=>point.value),max=Math.max(...values),min=Math.min(...values),range=max-min||1;
    const coords=points.map((point,index)=>({x:L+index*(W-L-R)/(points.length-1),y:T+((max-point.value)/range)*(H-T-B),...point}));
    const path=coords.map((point,index)=>(index?"L":"M")+point.x.toFixed(1)+","+point.y.toFixed(1)).join(" ");
    const unitLabel=metric==="weight"?unit:"cm";
    const dots=coords.map(point=>`<circle cx="${point.x.toFixed(1)}" cy="${point.y.toFixed(1)}" r="4" fill="var(--accent)"><title>${formatDate(point.entry.date)} · ${point.value.toFixed(1)} ${unitLabel}</title></circle>`).join("");
    return `<svg class="body-chart" role="img" aria-label="Evolução de ${bodyMetricLabel(metric)}" viewBox="0 0 ${W} ${H}"><path d="${path}" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path>${dots}<text x="${L}" y="${H-5}">${formatDateShort(points[0].entry.date)}</text><text x="${W-R}" y="${H-5}" text-anchor="end">${formatDateShort(points[points.length-1].entry.date)}</text></svg>`;
  }

  function saveBodyMeasurement(){
    const date=document.getElementById("measurementDate")?.value||calendarDateKey(new Date());
    if(!Number.isFinite(Date.parse(date+"T12:00:00"))){showToast("Escolha uma data válida","info");return;}
    let invalid=false;
    const read=id=>{
      const raw=document.getElementById(id)?.value.trim()||"";
      if(!raw)return null;
      const value=Number(raw);
      if(!Number.isFinite(value)||value<=0||value>500){invalid=true;return null;}
      return value;
    };
    const displayWeight=read("measurementWeight"),waist=read("measurementWaist"),chest=read("measurementChest"),hips=read("measurementHips"),arm=read("measurementArm"),thigh=read("measurementThigh");
    if(invalid){showToast("Confira os valores informados","info");return;}
    if([displayWeight,waist,chest,hips,arm,thigh].every(value=>value===null)){showToast("Informe pelo menos uma medida válida","info");return;}
    const entry={id:makeId("measure"),date:new Date(date+"T12:00:00").toISOString(),weight:displayWeight===null?null:fromDisplayLoad(displayWeight),waist,chest,hips,arm,thigh};
    data.bodyMeasurements.push(entry);
    data.bodyMeasurements.sort((a,b)=>new Date(a.date)-new Date(b.date));
    data.bodyMeasurements=data.bodyMeasurements.slice(-2000);
    save();renderBodyMeasurementsView();showToast("Medidas salvas neste dispositivo");
  }

  function removeBodyMeasurement(id){
    showConfirm("Remover este registro de medidas?",()=>{data.bodyMeasurements=data.bodyMeasurements.filter(entry=>entry.id!==id);save();renderBodyMeasurementsView();},"Remover");
  }

  function renderBodyMeasurementsView(){
    const container=document.getElementById("medidasView");
    const entries=[...(data.bodyMeasurements||[])].sort((a,b)=>new Date(a.date)-new Date(b.date));
    const options=[["weight","Peso"],["waist","Cintura"],["chest","Peito"],["hips","Quadril"],["arm","Braço"],["thigh","Coxa"]].map(([key,label])=>`<option value="${key}" ${bodyMetric===key?"selected":""}>${label}</option>`).join("");
    const list=entries.slice().reverse().map(entry=>{
      const values=[["Peso",entry.weight===null?null:Number(displayLoad(entry.weight).toFixed(2))],["Cintura",entry.waist],["Peito",entry.chest],["Quadril",entry.hips],["Braço",entry.arm],["Coxa",entry.thigh]].filter(item=>item[1]!==null&&item[1]!==undefined).map(item=>item[0]+": "+item[1]+(item[0]==="Peso"?" "+unit:" cm")).join(" · ");
      return `<article class="measure-entry"><div><b>${formatDate(entry.date)}</b><span>${values}</span></div><button type="button" aria-label="Remover medidas de ${formatDate(entry.date)}" onclick="removeBodyMeasurement('${entry.id}')">×</button></article>`;
    }).join("");
    container.innerHTML=`<div class="insights-heading"><span class="evo-kicker">ACOMPANHAMENTO PESSOAL</span><h2>Medidas</h2><p>Registros locais, incluídos no backup do app.</p></div>
      <section class="insight-card measure-form"><h3>Novo registro</h3><label>Data<input id="measurementDate" type="date" value="${calendarDateKey(new Date())}"></label>
        <div class="measurement-grid"><label>Peso (${unit})<input id="measurementWeight" type="number" min="0" step="0.1" inputmode="decimal"></label><label>Cintura (cm)<input id="measurementWaist" type="number" min="0" step="0.1" inputmode="decimal"></label><label>Peito (cm)<input id="measurementChest" type="number" min="0" step="0.1" inputmode="decimal"></label><label>Quadril (cm)<input id="measurementHips" type="number" min="0" step="0.1" inputmode="decimal"></label><label>Braço (cm)<input id="measurementArm" type="number" min="0" step="0.1" inputmode="decimal"></label><label>Coxa (cm)<input id="measurementThigh" type="number" min="0" step="0.1" inputmode="decimal"></label></div>
        <button class="btn-primary" type="button" onclick="saveBodyMeasurement()">Salvar medidas</button></section>
      <section class="insight-card"><div class="measure-chart-head"><h3>Tendência</h3><select aria-label="Medida exibida" onchange="setBodyMetric(this.value)">${options}</select></div>${generateBodyChart(entries,bodyMetric)}</section>
      <section class="insight-card"><h3>Histórico · ${entries.length} registro(s)</h3>${list||'<p class="insight-empty">Seus registros aparecerão aqui.</p>'}</section>`;
  }

  function renderToolsView(){
    const container=document.getElementById("ferramentasView");
    const day=data.days.find(item=>item.id===data.currentDayId);
    const recent=[...(data.workoutHistory||[])].sort((a,b)=>new Date(b.finishedAt)-new Date(a.finishedAt))[0];
    const exerciseCount=day?data.exercises.filter(ex=>ex.dayId===day.id).length:0;
    container.innerHTML=`<div class="insights-heading"><span class="evo-kicker">ATALHOS DE ACADEMIA</span><h2>Ferramentas</h2><p>Calculadora de anilhas e compartilhamento rápido.</p></div>
      <section class="insight-card plate-tool"><h3>Calculadora de anilhas</h3><div class="tool-form-grid"><label>Peso total (${unit})<input type="number" id="plateTarget" min="0" step="0.5" inputmode="decimal" placeholder="Ex.: 100" oninput="calculatePlates()"></label><label>Peso da barra (${unit})<input type="number" id="plateBar" min="0" step="0.5" inputmode="decimal" value="${unit==="kg"?20:45}" oninput="calculatePlates()"></label></div><div id="plateResult" class="plate-result">Informe o peso total para calcular.</div></section>
      <section class="insight-card"><h3>Compartilhar rotina</h3><p>${day?escapeHtml(day.name)+" · "+exerciseCount+" exercício(s)":"Crie ou selecione uma rotina na aba Treino."}</p><div class="tool-actions"><button type="button" class="btn-primary" ${day?"":"disabled"} onclick="shareCurrentRoutine()">Compartilhar</button><button type="button" class="session-action" ${day?"":"disabled"} onclick="exportCurrentRoutine()">Exportar rotina</button></div></section>
      <section class="insight-card"><h3>Compartilhar último treino</h3><p>${recent?formatDate(recent.finishedAt)+" · "+recent.exerciseCount+" exercício(s) · "+recent.setCount+" série(s)":"Encerre um treino para gerar um resumo compartilhável."}</p><button type="button" class="session-action" ${recent?"":"disabled"} onclick="shareLatestWorkout()">Compartilhar resumo</button></section>`;
  }

  function calculatePlates(){
    const output=document.getElementById("plateResult");
    const target=Number(document.getElementById("plateTarget")?.value),bar=Number(document.getElementById("plateBar")?.value);
    if(!output)return;
    if(!Number.isFinite(target)||target<=0){output.textContent="Informe o peso total para calcular.";return;}
    if(!Number.isFinite(bar)||bar<0||target<bar){output.textContent="O peso total precisa ser igual ou maior que o peso da barra.";return;}
    const plates=unit==="kg"?[25,20,15,10,5,2.5,1.25,1,0.5]:[45,35,25,10,5,2.5,1.25];
    let remaining=Number(((target-bar)/2).toFixed(3));const chosen=[];
    for(const weight of plates){const count=Math.floor((remaining+1e-8)/weight);if(count){chosen.push({weight,count});remaining=Number((remaining-count*weight).toFixed(3));}}
    output.innerHTML=remaining>0.01?"Essa combinação não fecha com as anilhas comuns. Confira o peso da barra e o total.":`<b>Em cada lado:</b> ${chosen.length?chosen.map(item=>item.count+" × "+item.weight+" "+unit).join(" + "):"sem anilhas"}<small>Total com a barra: ${target} ${unit}</small>`;
  }

  function routineText(day,exercises){
    return [day.name,...exercises.map((ex,index)=>(index+1)+". "+ex.name+(ex.targetMinReps&&ex.targetMaxReps?" · "+ex.targetMinReps+"–"+ex.targetMaxReps+" reps":""))].join("\n");
  }

  async function shareCurrentRoutine(){
    const day=data.days.find(item=>item.id===data.currentDayId);if(!day)return;
    const exercises=data.exercises.filter(ex=>ex.dayId===day.id),text=routineText(day,exercises);
    try{
      if(navigator.share){await navigator.share({title:"Rotina "+day.name,text});return;}
      await navigator.clipboard.writeText(text);showToast("Rotina copiada para compartilhar");
    }catch(error){if(error?.name!=="AbortError"){downloadRoutineJson(day,exercises);showToast("Arquivo da rotina baixado");}}
  }

  function downloadRoutineJson(day,exercises){
    const payload={app:"diario-de-treino",type:"routine",version:1,exportedAt:new Date().toISOString(),routine:{name:day.name,exercises:exercises.map(ex=>({name:ex.name,muscleGroup:ex.muscleGroup,supersetGroup:ex.supersetGroup,targetMinReps:ex.targetMinReps,targetMaxReps:ex.targetMaxReps,restSeconds:ex.restSeconds}))}};
    const url=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:"application/json"}));
    const link=document.createElement("a");link.href=url;link.download="rotina-"+exerciseNameKey(day.name).replace(/[^a-z0-9]+/g,"-")+".json";link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
  }

  function exportCurrentRoutine(){
    const day=data.days.find(item=>item.id===data.currentDayId);
    if(day)downloadRoutineJson(day,data.exercises.filter(ex=>ex.dayId===day.id));
  }

  async function shareLatestWorkout(){
    const workout=[...(data.workoutHistory||[])].sort((a,b)=>new Date(b.finishedAt)-new Date(a.finishedAt))[0];if(!workout)return;
    const day=data.days.find(item=>item.id===workout.dayId);
    const text=["Treino "+(day?.name||"concluído"),formatDuration(workout.durationSeconds),workout.exerciseCount+" exercícios",workout.setCount+" séries",Math.round(displayLoad(workout.volume)).toLocaleString("pt-BR")+" "+unit+"·reps",workout.prCount+" recorde(s)"].join(" · ");
    try{if(navigator.share){await navigator.share({title:"Resumo do treino",text});return;}await navigator.clipboard.writeText(text);showToast("Resumo copiado para compartilhar");}
    catch(error){if(error?.name!=="AbortError")showToast("Não foi possível compartilhar neste navegador","info");}
  }

  function render(){
    renderViewTabs();renderWorkoutSummary();renderWeeklySummary();
    const views={treino:"treinoView",evolucao:"evolucaoView",calendario:"calendarioView",analises:"analisesView",medidas:"medidasView",ferramentas:"ferramentasView",mais:"maisView"};
    Object.entries(views).forEach(([key,id])=>{const el=document.getElementById(id);if(el)el.style.display=currentView===key?"":"none";});
    const summary=document.getElementById("workoutSummary"),weekly=document.getElementById("weeklySummary");
    if(currentView==="treino"){
      renderDayTabs();renderTreinoView();
      const workspace=document.getElementById("dayWorkspace"),list=document.getElementById("exerciseList");
      if(workspace&&summary)workspace.after(summary); if(list&&weekly)list.after(weekly);
      summary.style.display=data.days.length?"":"none";weekly.style.display=data.days.length?"":"none";
    }else{
      summary.style.display="none";weekly.style.display="none";
      if(currentView==="evolucao")renderEvolucaoView();
      else if(currentView==="calendario")renderCalendarView();
      else if(currentView==="analises"){renderAnalyticsView();addMoreBackButton(document.getElementById("analisesView"));}
      else if(currentView==="medidas"){renderBodyMeasurementsView();addMoreBackButton(document.getElementById("medidasView"));}
      else if(currentView==="ferramentas"){renderToolsView();addMoreBackButton(document.getElementById("ferramentasView"));}
      else if(currentView==="mais")renderMoreView();
    }
  }
  document.getElementById("newExerciseInput").addEventListener("keydown", e => {
    if(e.key === "ArrowDown"){
      const first = document.querySelector(".suggestion-item"); if(first){ e.preventDefault(); first.focus(); }
    }else if(e.key === "Escape") document.getElementById("suggestionBox").style.display="none";
    else if(e.key === "Enter"){
      const first = document.querySelector(".suggestion-item");
      if(first && document.getElementById("suggestionBox").style.display === "block"){ e.preventDefault(); first.click(); }
      else addExercise();
    }
  });

  document.addEventListener("click", e => {
    if(!e.target.closest(".app-menu")) closeBackupMenu();
  });
  document.addEventListener("keydown", e => {
    if(e.key === "Escape" && !document.getElementById("backupMenu")?.hidden){
      closeBackupMenu();
      document.getElementById("backupMenuButton")?.focus();
    }
  });

  load();
  // Ao reabrir, preserva o tempo e restaura o treino pausado até o usuário continuar.
  if(data.activeWorkout){ normalizeRestoredWorkout(); save(); }
  render();

  if("serviceWorker" in navigator){
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("service-worker.js").catch(err => {
        console.log("Falha ao registrar service worker:", err);
      });
    });
  }
</script>

</body>
